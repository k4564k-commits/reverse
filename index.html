<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>실시간 역순 카메라</title><meta name="theme-color" content="#101218"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;background:#101218;color:white;font-family:system-ui,sans-serif}header{padding:15px 18px;font-size:19px;font-weight:700}main{padding:0 12px 22px}.camera{position:relative;background:#252934;border-radius:16px;overflow:hidden;min-height:260px}video{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{background:#3278fa;border:0;color:white;padding:12px 16px;border-radius:10px;font-weight:700;font-size:15px}button:disabled{opacity:.5}#status{color:#c5ccd9;font-size:14px;min-height:22px}#result{white-space:pre-wrap;background:#222632;padding:14px;border-radius:12px;min-height:55px;font-size:19px;overflow-wrap:anywhere}small{display:block;color:#b7bdca;line-height:1.6;margin-top:12px}</style></head><body><header>📷 실시간 글자 역순 카메라</header><main><div class="camera"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas></div><div class="controls"><button id="start">카메라 시작</button><button id="stop" disabled>중지</button><button id="switch" disabled>카메라 전환</button></div><div id="status">시작 버튼을 누르세요.</div><h3>인식된 글자 (역순)</h3><div id="result">아직 인식된 글자가 없습니다.</div><small>한글·영어·숫자를 인식합니다. 원래 글자 위치에 역순 글자를 덧씌웁니다. 첫 실행 시 인식 모델 다운로드에 시간이 걸릴 수 있습니다. HTTPS 또는 localhost 환경에서 카메라가 작동합니다. 글자를 밝고 선명하게 비춰 주세요.</small></main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const video=document.querySelector('#video'),canvas=document.querySelector('#overlay'),ctx=canvas.getContext('2d'),statusEl=document.querySelector('#status'),result=document.querySelector('#result');
const startBtn=document.querySelector('#start'),stopBtn=document.querySelector('#stop'),switchBtn=document.querySelector('#switch');let stream=null,worker=null,running=false,busy=false,facing='environment',timer=null;
function reverse(s){return Array.from(s).reverse().join('')}
function status(s){statusEl.textContent=s}
async function stop(){running=false;clearTimeout(timer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;ctx.clearRect(0,0,canvas.width,canvas.height);startBtn.disabled=false;stopBtn.disabled=true;switchBtn.disabled=true;status('카메라가 중지되었습니다.')}
async function start(){await stop();if(!navigator.mediaDevices?.getUserMedia){status('카메라를 사용할 수 없습니다. HTTPS 주소로 열어주세요.');return}startBtn.disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();running=true;stopBtn.disabled=false;switchBtn.disabled=false;status('문자 인식 준비 중...');if(!worker){worker=await Tesseract.createWorker('kor+eng',1,{logger:m=>{if(m.status==='loading language traineddata')status('한글/영어 인식 데이터 다운로드 중... '+Math.round((m.progress||0)*100)+'%')}})}status('실시간 인식 중...');scan()}catch(e){status('시작 실패: '+e.message);await stop();status('카메라 권한과 HTTPS 접속 여부를 확인해 주세요.')}}
async function scan(){if(!running||busy)return;busy=true;try{if(video.videoWidth){const w=video.videoWidth,h=video.videoHeight;canvas.width=w;canvas.height=h;const output=await worker.recognize(video);if(!running)return;ctx.clearRect(0,0,w,h);let lines=output.data.lines||[];let text=[];for(const line of lines){const raw=(line.text||'').trim();if(!raw||!/[\p{L}\p{N}]/u.test(raw))continue;const rev=reverse(raw);text.push(rev);const b=line.bbox;if(!b)continue;const x=b.x0,y=b.y0,bw=b.x1-b.x0,bh=b.y1-b.y0;ctx.fillStyle='rgba(9,17,30,.88)';ctx.fillRect(x-3,y-3,bw+6,bh+6);let size=Math.max(13,Math.min(55,bh*.85));ctx.font=`bold ${size}px sans-serif`;while(ctx.measureText(rev).width>bw+12&&size>10){size-=1;ctx.font=`bold ${size}px sans-serif`}ctx.fillStyle='#a9ffdb';ctx.textBaseline='middle';ctx.fillText(rev,x,y+bh/2,bw+12)}result.textContent=text.join('\n')||'글자를 카메라에 비춰 주세요.';status('실시간 인식 중...')} }catch(e){status('인식 오류: '+e.message)}finally{busy=false;if(running)timer=setTimeout(scan,550)}}
startBtn.onclick=start;stopBtn.onclick=stop;switchBtn.onclick=async()=>{facing=facing==='environment'?'user':'environment';await start()};window.addEventListener('pagehide',()=>{stop();worker?.terminate()});
</script><script>if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.warn)); }</script></body></html>
